# Configuration Supabase locale / CLI.
# Le projet hébergé doit être configuré dans le Dashboard (voir supabase/email/README.md).
# Aucun secret SMTP n'est stocké ici : valeurs lues depuis l'environnement.

project_id = "payzik-pos"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enable_signup = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://payzik-l5fn.vercel.app"]

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600
max_frequency = "1m"

[auth.email.smtp]
host = "env(PAYZIK_SMTP_HOST)"
port = 587
user = "env(PAYZIK_SMTP_USER)"
pass = "env(PAYZIK_SMTP_PASS)"
# Mode test gratuit : destination limitée à l'email du compte Resend.
# Production : passer à une adresse sur le domaine vérifié (ex. no-reply@payzik.ma).
admin_email = "onboarding@resend.dev"
sender_name = "Payzik"

[auth.email.template.confirmation]
subject = "Payzik — confirmez votre adresse email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Payzik — réinitialisez votre mot de passe"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Payzik — confirmez votre nouvelle adresse email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Payzik — votre lien de connexion"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.reauthentication]
subject = "Payzik — code de vérification : {{ .Token }}"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.invite]
subject = "Payzik — invitation à rejoindre votre espace"
content_path = "./supabase/templates/invite.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Payzik — votre mot de passe a été modifié"
content_path = "./supabase/templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Payzik — votre adresse email a été modifiée"
content_path = "./supabase/templates/email_changed.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "Payzik — votre numéro de téléphone a été modifié"
content_path = "./supabase/templates/phone_changed.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "Payzik — une méthode de vérification a été ajoutée"
content_path = "./supabase/templates/mfa_factor_enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "Payzik — une méthode de vérification a été retirée"
content_path = "./supabase/templates/mfa_factor_unenrolled.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "Payzik — une méthode de connexion a été liée"
content_path = "./supabase/templates/identity_linked.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "Payzik — une méthode de connexion a été retirée"
content_path = "./supabase/templates/identity_unlinked.html"
