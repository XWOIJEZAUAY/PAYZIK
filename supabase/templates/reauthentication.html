<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payzik — vérification</title></head>
<body style="margin:0;padding:24px;background:#FFF8EA;color:#3A2A1F;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:16px;padding:28px;">
    <tr><td style="font-size:22px;font-weight:700;color:#FF7A1A;">PAYZIK</td></tr>
    <tr><td style="padding-top:20px;font-size:18px;font-weight:700;">Votre code de vérification</td></tr>
    <tr><td style="padding-top:12px;font-size:14px;line-height:22px;">
      Saisissez le code ci-dessous dans Payzik pour confirmer votre identité. Il expire rapidement.
    </td></tr>
    <tr><td style="padding-top:18px;font-size:26px;font-weight:700;letter-spacing:4px;color:#D95F00;">{{ .Token }}</td></tr>
    <tr><td style="padding-top:18px;font-size:12px;line-height:20px;color:#6B594A;">
      Ne partagez jamais ce code. Si vous n'êtes pas à l'origine de cette demande, ignorez cet email.
    </td></tr>
  </table>
</body>
</html>
