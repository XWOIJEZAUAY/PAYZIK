<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payzik — invitation</title></head>
<body style="margin:0;padding:24px;background:#FFF8EA;color:#3A2A1F;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:16px;padding:28px;">
    <tr><td style="font-size:22px;font-weight:700;color:#FF7A1A;">PAYZIK</td></tr>
    <tr><td style="padding-top:20px;font-size:18px;font-weight:700;">Vous êtes invité sur Payzik</td></tr>
    <tr><td style="padding-top:12px;font-size:14px;line-height:22px;">
      Acceptez l'invitation pour activer votre accès à l'espace Payzik associé à <strong>{{ .Email }}</strong>.
    </td></tr>
    <tr><td style="padding-top:22px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FF7A1A;color:#FFFFFF;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:700;">Accepter l'invitation</a>
    </td></tr>
    <tr><td style="padding-top:22px;font-size:12px;line-height:20px;color:#6B594A;">
      Lien de secours : <span style="word-break:break-all;">{{ .ConfirmationURL }}</span>
    </td></tr>
  </table>
</body>
</html>
